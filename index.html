let view='all';
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text)n.textContent=text;return n}

function makeFormTable(items){
 const wrap=el('div','table-scroll'),table=el('table','form-list'),thead=el('thead'),header=el('tr');
 for(const title of ['번호','서식명','학생','교수','직원']){const th=el('th','',title);th.setAttribute('scope','col');header.append(th);}thead.append(header);table.append(thead);
 const body=el('tbody');
 for(const row of items){const tr=el('tr'),nameCell=el('td','',row.name);if(row.description)nameCell.append(el('small','row-description',row.description));tr.append(el('td','',row.number),nameCell);
  for(const role of ['학생','교수','직원']){const td=el('td'),entry=row.roles[role];if(!entry)td.append(el('span','placeholder','—'));else if(entry.note)td.append(el('span','placeholder',entry.label));else if(!entry.url)td.append(el('span','placeholder','링크 미등록'));else{const a=el('a','open',entry.label);a.href=entry.url;a.target=entry.url.startsWith('#')?'_self':'_blank';a.rel='noopener noreferrer';td.append(a);}tr.append(td);}body.append(tr);
 }table.append(body);wrap.append(table);return wrap;
}
function renderForms(){
 const q=document.querySelector('#form-search').value.trim().toLocaleLowerCase('ko'),items=formRows.filter(r=>(r.number+' '+r.name+' '+r.process).toLocaleLowerCase('ko').includes(q)),out=document.querySelector('#form-list');out.replaceChildren();
 document.querySelector('#list-status').textContent=(q?'검색 ':'전체 ')+items.length+'건';
 if(!items.length){out.append(el('p','empty','검색 결과가 없습니다.'));return;}
 if(view==='all'){out.append(makeFormTable(items));return;}
 const groups=new Map();for(const row of items){if(!groups.has(row.process))groups.set(row.process,[]);groups.get(row.process).push(row);}
