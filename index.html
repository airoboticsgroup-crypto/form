let view='all';
function el(tag,cls,text){const n=document.createElement(tag);if(cls)n.className=cls;if(text)n.textContent=text;return n;}
function makeFormTable(items){
 const wrap=el('div','table-scroll'),table=el('table','form-list'),thead=el('thead'),header=el('tr');
 const roles=view==='all'?['학생','교수','직원']:[{student:'학생',professor:'교수',staff:'직원'}[view]];
 for(const title of ['번호','서식명',...roles]){const th=el('th','',title);th.setAttribute('scope','col');header.append(th);}thead.append(header);table.append(thead);
 const body=el('tbody');
 for(const row of items){const tr=el('tr'),nameCell=el('td');nameCell.textContent=row.name;if(row.description)nameCell.append(el('small','row-description',row.description));tr.append(el('td','',row.number),nameCell);
  for(const role of roles){const td=el('td'),entry=row.roles[role];if(!entry)td.append(el('span','placeholder','—'));else if(Array.isArray(entry.links)){const links=el('div','ta-staff-links');for(const item of entry.links){if(!item.url)continue;const link=el('a','open',item.label);link.href=item.url;link.target='_blank';link.rel='noopener noreferrer';links.append(link);}td.append(links);}else if(entry.note)td.append(el('span','placeholder',entry.label));else if(!entry.url)td.append(el('span','placeholder','링크 미등록'));else{const link=el('a','open',entry.label);link.href=entry.url;link.target='_blank';link.rel='noopener noreferrer';td.append(link);}tr.append(td);}body.append(tr);
 }table.append(body);wrap.append(table);return wrap;
}

 if(admin){

    '양식 3':{url:'https://script.google.com/macros/s/AKfycbxg6F81csxDniBC69NNvfFgFGUWXISX6lDc8_Z8DW0BvyadFTWBg5ZTZyj2ouHtqcbJ/exec?page=admin',label:'교과목 결과보고서 관리'},

    '양식 9':{url:'https://docs.google.com/spreadsheets/d/1QEFKLZYrYCU_t7qJZgbGJwl4T-HvG307vaSUpmfC3eI/edit',label:'출장 접수관리 시트'},

   if(entry){const link=el('a','open',entry.label);link.href=entry.url;link.target='_blank';link.rel='noopener noreferrer';cell.append(link);}
   else if(r.number==='양식 7')cell.append(el('span','all-muted','통합관리자에서 관리'));

   tr.append(cell);body.append(tr);
  }

  const ltd=el('td');const link=el('a','open','통합관리자 접속');link.href=ADMIN_URL;link.target='_blank';link.rel='noopener noreferrer';ltd.append(link);
  utr.append(utd,ltd);const utb=el('tbody');utb.append(utr);ut.append(utb);unified.append(ut);out.append(unified);
  return;
 }
 const q=document.querySelector('#form-search').value.trim().toLocaleLowerCase('ko');const role={student:'학생',professor:'교수',staff:'직원'}[view];const items=formRows.filter(r=>(!role||r.roles[role])&&(r.number+' '+r.name+' '+(r.description||'')).toLocaleLowerCase('ko').includes(q));

}
function setView(next){view=next;for(const id of ['all','student','professor','staff','admin'])document.querySelector('#view-'+id).setAttribute('aria-selected',String(id===next));renderForms();}
for(const id of ['all','student','professor','staff','admin'])document.querySelector('#view-'+id).addEventListener('click',()=>setView(id));

if(['all','student','professor','staff','admin'].includes(initialView))setView(initialView);
else renderForms();
