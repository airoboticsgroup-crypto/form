<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>관리자 권한 요청</title><style>body{margin:0;background:#f3f6fa;color:#213e55;font:15px/1.7 'Malgun Gothic','맑은 고딕',sans-serif}main{max-width:800px;margin:48px auto;padding:0 22px}.panel{background:#fff;border:1px solid #dbe4ed;border-radius:12px;padding:28px;margin-top:24px}h1{font-size:26px;margin:0 0 16px}a{color:#205674}.open{display:inline-block;background:#18344b;color:white;padding:12px 20px;border-radius:7px;text-decoration:none}.note{padding:12px 16px;background:#fff5df;border-radius:7px}.muted{color:#5c7183;font-size:13px}:focus-visible{outline:3px solid #d69c23;outline-offset:3px}[hidden]{display:none!important}</style></head><body><main><a href="./index.html">← 사업단 서식안내</a><div class="panel"><h1>관리자 권한 요청</h1><p>Google 계정으로 접속합니다. 등록된 업무 권한에 따라 이용할 수 있습니다.</p><a id="open" class="open" hidden>Google 로그인으로 열기</a><p id="connection" class="note">관리 웹앱 배포 주소 연결을 준비 중입니다.</p><p class="muted">학생 신청서용 웹앱과 별도의 관리자 전용 웹앱입니다.</p></div><p class="muted">시스템 문의: <a href="mailto:uanshin@kw.ac.kr">uanshin@kw.ac.kr</a> / <a href="mailto:airobotics.group@gmail.com">airobotics.group@gmail.com</a></p></main><script>
// 관리자 전용 웹앱 배포 후 받은 /exec 주소를 입력합니다. 기존 학생용 웹앱 주소를 사용하지 마세요.
const ADMIN_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbzLm1FY5wSsAJtiCEcBfxQ8F98MvD9doUBAeIIhaFM_Qh11P0SoLTHSj_ETtd0xXCuA/exec";
const PAGE = 'request';
if(/^https:\/\/script\.google\.com\/macros\/s\/[A-Za-z0-9_-]+\/exec$/.test(ADMIN_WEB_APP_URL)){
 const link=document.getElementById('open'),url=new URL(ADMIN_WEB_APP_URL);url.searchParams.set('page',PAGE);const module=new URL(location.href).searchParams.get('module');if(['ta','equipment','material','biztrip'].includes(module))url.searchParams.set('module',module);link.href=url.href;link.hidden=false;document.getElementById('connection').hidden=true;
}
